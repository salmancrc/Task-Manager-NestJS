services:
  backend:
    build: .
    container_name: task-manager-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in backend/.env}
      NODE_ENV: production
